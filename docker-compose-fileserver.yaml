version: '3'

services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: on-failure
    ports:
      - 8000:80
    volumes:
      - ~/shared-files:/srv
      - ~/.filebrowser.db:/database.db
      - ~/.filebrowser.json:/.filebrowser.json
    environment:
      - FB_NOAUTH=false  # Требовать пароль
